[project]
name = "rlvitals"
version = "0.1.0"
description = "Run-health checks for reinforcement learning on language models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Soheil Sanati Moutaban" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rlvitals = "rlvitals.cli:main"

[project.optional-dependencies]
transformers = [
    "transformers>=4.56.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "transformers>=4.56.2",
]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
