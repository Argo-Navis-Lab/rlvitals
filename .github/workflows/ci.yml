# Runs on GitHub's computers after every push: the four checks, on the oldest and newest Python.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install Python and the locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatting (ruff)
        run: uv run ruff format --check .

      - name: Types (pyright)
        run: uv run pyright

      - name: Tests (pytest)
        run: uv run pytest
